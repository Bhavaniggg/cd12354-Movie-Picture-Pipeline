
name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mp-frontend
  EKS_CLUSTER: cluster

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

  deploy:
    name: Build, Push and Deploy Frontend
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get backend LoadBalancer URL
        id: backend-url
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

          echo "Waiting for backend LoadBalancer..."

          for i in {1..60}; do
            HOST=$(kubectl get svc backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            IP=$(kubectl get svc backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$HOST" ]; then
              echo "url=http://$HOST" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ -n "$IP" ]; then
              echo "url=http://$IP" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep 10
          done

          echo "Backend LoadBalancer was not ready."
          exit 1

      - name: Build frontend Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_API_URL: ${{ steps.backend-url.outputs.url }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=$BACKEND_API_URL \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./starter/frontend

      - name: Push frontend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy frontend to EKS
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -k starter/frontend/k8s

          kubectl set image deployment/frontend \
            frontend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          kubectl rollout status deployment/frontend --timeout=300s

      - name: Verify frontend deployment
        run: |
          kubectl get deployment frontend
          kubectl get pods
          kubectl get service frontend
